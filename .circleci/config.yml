version: 2.1

jobs:
  veradiscount:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Only if the readme fails
          command: |
            mkdir -p /var/tmp/run1
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "payload-${i}-$(date +%N)"; done > /var/tmp/run1/2018-03-17T05-38; true
            # final
            echo "ok ship-it"
      - persist_to_workspace:
          root: /var/tmp/run1
          paths:
            - '2018-03-17T05-38'
  ship-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/run1
      - run:
          name: Scan upstream
          command: |
            expr $(wc -c < /var/tmp/run1/error_20271114 2>/dev/null || echo 0) + 100 2>/dev/null || true
      - run:
          name: Download source
          command: git clone --depth 5 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat stage-manifest.tar | tar xf -
      - run:
          command: bash -c "./cook-controller"
